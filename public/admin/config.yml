backend:
  name: github
  repo: loreBianchi/sci-club-chiari
  branch: feat/claudio # TODO: cambiare in "main" prima/al merge della PR
  base_url: https://sci-club-chiari-git-feat-claudio-lorebianchis-projects.vercel.app
  auth_endpoint: api/auth

media_folder: "public/assets/attivita"
public_folder: "/assets/attivita"

collections:
  - name: "settings"
    label: "Impostazioni sito"
    files:
      - name: "general"
        label: "Generali"
        file: "content/settings.json"
        fields:
          - {
              label: "Tesseramento aperto",
              name: "isSeasonOpen",
              widget: "boolean",
              hint: "Mostra banner e CTA di iscrizione sul sito",
            }
          - {
              label: "Stagione corrente",
              name: "currentSeason",
              widget: "string",
              hint: "Formato: 2025/26",
            }
          - {
              label: "Prezzo Tesseramento Base (€)",
              name: "priceBase",
              widget: "number",
              value_type: "int",
            }
          - {
              label: "Prezzo Tesseramento Premium (€)",
              name: "pricePremium",
              widget: "number",
              value_type: "int",
            }
          - {
              label: "Scadenza polizza assicurativa Premium",
              name: "policyExpiryDate",
              widget: "string",
              hint: "Formato: 31/08/2026",
            }

  - name: "activities"
    label: "Attività"
    folder: "_activities"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - {
          label: "Immagine di copertina",
          name: "coverImage",
          widget: "image",
          media_folder: "/public/assets/attivita",
          public_folder: "/assets/attivita",
        }
      - {
          label: "Data",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]",
          picker_utc: true,
        }
      - label: "Immagine OG"
        name: "ogImage"
        widget: "object"
        fields:
          - {
              label: "URL",
              name: "url",
              widget: "image",
              media_folder: "/public/assets/attivita",
              public_folder: "/assets/attivita",
            }
      - {
          label: "Link iscrizione (banner)",
          name: "bannerLink",
          widget: "string",
          required: false,
        }
      - { label: "Corpo", name: "body", widget: "markdown" }

  - name: "news"
    label: "News"
    folder: "_news"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Estratto", name: "excerpt", widget: "text" }
      - {
          label: "Data",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]",
          picker_utc: true,
        }
      - { label: "Corpo", name: "body", widget: "markdown" }
